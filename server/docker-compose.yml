# docker compose up -d            -> server only, on http://<pi-ip>:8787 (home network)
# docker compose --profile tunnel up -d   -> also a Cloudflare Tunnel, so phones reach it from the mountain
services:
  friends:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      # Put SERVER_PASSWORD=... in the .env file next to this one (see SETUP-PI.md).
      - SERVER_PASSWORD=${SERVER_PASSWORD:-}
      # Optional: the username that runs the server (otherwise the first account to register).
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}

  tunnel:
    # A fixed version, so a new release is only used once you choose to update this line.
    image: cloudflare/cloudflared:2026.11.2
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - friends
