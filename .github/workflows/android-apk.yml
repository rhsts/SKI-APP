name: Build Android APK

# Builds an installable APK, checks on an Android emulator that it starts without
# crashing, and only then attaches it to a GitHub Release.
# Optional repository secret GOOGLE_MAPS_API_KEY enables maps.
on:
  push:
    branches: [main, claude/elegant-mendel-38c8p6]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write # to create the release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_NO_TELEMETRY: '1'
    outputs:
      file: ${{ steps.apk.outputs.file }}
      sha1: ${{ steps.apk.outputs.sha1 }}
      maps: ${{ steps.apk.outputs.maps }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and tests
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Generate the Android project
        run: |
          npx expo prebuild --platform android --no-install
          echo "--- shrinking settings ---"
          grep -n -i "minify\|shrinkResources" android/gradle.properties android/app/build.gradle || true

      - name: Build release APK
        working-directory: android
        # arm64 for phones, x86_64 so the emulator check can run the same APK.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      - name: Collect APK
        id: apk
        run: |
          OUT=ski-tracker-${BUILD_NUMBER}.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          ls -lh "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          # Fingerprint of the key the APK is actually signed with (for restricting the Maps key).
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          SHA1=$("$APKSIGNER" verify --print-certs "$OUT" | sed -n 's/.*certificate SHA-1 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "Signing SHA-1: $SHA1"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then echo "maps=✅ Maps enabled" >> "$GITHUB_OUTPUT"; else echo "maps=⚠️ Built without a Google Maps key: maps show a placeholder. Add the GOOGLE_MAPS_API_KEY secret and run the workflow again." >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 14

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./scripts/smoke-test.sh ${{ needs.build.outputs.file }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ski Tracker 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ needs.build.outputs.file }}
          body: |
            **Install on Android:** tap `${{ needs.build.outputs.file }}` below → allow your browser to "install unknown apps" → Install.
            Updates install over the previous version and keep your data.
            ✔️ Checked on an Android emulator: the app starts and keeps running.

            ${{ needs.build.outputs.maps }}

            To restrict your Google Maps key (Android apps): package `com.rhsts.skiapp`, SHA-1 `${{ needs.build.outputs.sha1 }}`

            Built from ${{ github.sha }}.
